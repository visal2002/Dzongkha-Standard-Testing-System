apiVersion: apps/v1
kind: Deployment
metadata: { name: identity-service }
spec:
  replicas: 2
  selector: { matchLabels: { app: identity-service } }
  template:
    metadata: { labels: { app: identity-service } }
    spec:
      serviceAccountName: identity-service
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: identity-service
          image: registry.example.gov.bt/dzongjuk/identity-service:replace
          ports: [{ containerPort: 8001 }]
          env: [{ name: DATABASE_NAME, value: dzongjuk_identity }]
          envFrom: [{ configMapRef: { name: dzongjuk-config } }, { secretRef: { name: dzongjuk-secrets } }]
          readinessProbe: { httpGet: { path: /health/ready, port: 8001 }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /health/live, port: 8001 }, periodSeconds: 15 }
          resources: { requests: { cpu: 100m, memory: 192Mi }, limits: { cpu: 1000m, memory: 512Mi } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
---
apiVersion: v1
kind: Service
metadata: { name: identity-service }
spec: { selector: { app: identity-service }, ports: [{ port: 8001, targetPort: 8001 }] }
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: identity-service }
automountServiceAccountToken: false
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: identity-service }
spec: { minAvailable: 1, selector: { matchLabels: { app: identity-service } } }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: identity-service }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: identity-service }
  minReplicas: 2
  maxReplicas: 8
  metrics: [{ type: Resource, resource: { name: cpu, target: { type: Utilization, averageUtilization: 65 } } }]
