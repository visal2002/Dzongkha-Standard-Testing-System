apiVersion: apps/v1
kind: Deployment
metadata: { name: registration-service }
spec:
  replicas: 2
  selector: { matchLabels: { app: registration-service } }
  template:
    metadata: { labels: { app: registration-service } }
    spec:
      serviceAccountName: registration-service
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: registration-service
          image: registry.example.gov.bt/dzongjuk/registration-service:replace
          ports: [{ containerPort: 8002 }]
          env: [{ name: DATABASE_NAME, value: dzongjuk_registration }]
          envFrom: [{ configMapRef: { name: dzongjuk-config } }, { secretRef: { name: dzongjuk-secrets } }]
          readinessProbe: { httpGet: { path: /health/ready, port: 8002 }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /health/live, port: 8002 }, periodSeconds: 15 }
          resources: { requests: { cpu: 150m, memory: 256Mi }, limits: { cpu: 1500m, memory: 768Mi } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
---
apiVersion: v1
kind: Service
metadata: { name: registration-service }
spec: { selector: { app: registration-service }, ports: [{ port: 8002, targetPort: 8002 }] }
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: registration-service }
automountServiceAccountToken: false
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: registration-service }
spec: { minAvailable: 1, selector: { matchLabels: { app: registration-service } } }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: registration-service }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: registration-service }
  minReplicas: 2
  maxReplicas: 12
  metrics: [{ type: Resource, resource: { name: cpu, target: { type: Utilization, averageUtilization: 60 } } }]
