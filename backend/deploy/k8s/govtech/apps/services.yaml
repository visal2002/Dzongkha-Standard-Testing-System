apiVersion: v1
kind: ServiceAccount
metadata:
  name: dzongjuk-app
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-service
spec:
  replicas: 2
  selector:
    matchLabels: { app: identity-service }
  template:
    metadata:
      labels: { app: identity-service, app.kubernetes.io/part-of: dzongjuk }
    spec:
      serviceAccountName: dzongjuk-app
      imagePullSecrets: [{ name: harbor-registry }]
      securityContext: { runAsNonRoot: true, fsGroup: 101, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: identity-service
          image: dev-harbor.systems.gov.bt/dzongjuk/identity-service:deployment-tag
          envFrom:
            - configMapRef: { name: dzongjuk-config }
            - secretRef: { name: dzongjuk-secrets }
          ports: [{ name: http, containerPort: 8001 }]
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { cpu: 750m, memory: 768Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata: { name: identity-service }
spec:
  selector: { app: identity-service }
  ports: [{ name: http, port: 8001, targetPort: http }]
---
