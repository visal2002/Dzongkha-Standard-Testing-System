apiVersion: v1
kind: Pod
metadata:
  name: database-migrator
  namespace: dzongjuk
  labels:
    app: database-migrator
    app.kubernetes.io/part-of: dzongjuk
spec:
  restartPolicy: Never
  serviceAccountName: dzongjuk-platform
  imagePullSecrets: [{ name: harbor-registry }]
  securityContext:
    runAsNonRoot: true
    runAsUser: 70
    runAsGroup: 70
    fsGroup: 70
    seccompProfile: { type: RuntimeDefault }
  containers:
    - name: database-migrator
      image: dev-harbor.systems.gov.bt/dzongjuk/postgres:deployment-tag
      command: [sh, /opt/dzongjuk/provision-service-databases.sh]
      envFrom:
        - configMapRef: { name: dzongjuk-config }
      env:
        - name: PGHOST
          value: postgres
        - name: PGPORT
          value: "5432"
        - name: PGUSER
          valueFrom: { secretKeyRef: { name: dzongjuk-secrets, key: DATABASE_USER } }
        - name: PGPASSWORD
          valueFrom: { secretKeyRef: { name: dzongjuk-secrets, key: DATABASE_PASSWORD } }
      resources:
        requests: { cpu: 100m, memory: 128Mi }
        limits: { cpu: 500m, memory: 512Mi }
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: { drop: [ALL] }
      volumeMounts:
        - { name: tmp, mountPath: /tmp }
  volumes:
    - { name: tmp, emptyDir: {} }
