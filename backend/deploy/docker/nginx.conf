events {}
http {
  limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

  # Docker's embedded DNS server.
  #
  # Without a resolver, nginx resolves every proxy_pass hostname once while loading
  # the configuration and then caches that IP for the lifetime of the worker. Each
  # `docker compose up --build` recreates the service containers and Docker hands
  # them new IPs, so the gateway carries on proxying to addresses nothing is
  # listening on any more and answers 502 until it is manually restarted. The
  # browser surfaces that as "Network Error", and it comes back on every rebuild.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # ─── public gateway ────────────────────────────────────────────────────────
  # Reachable from outside the compose network (published as :8000).
  server {
    listen 8000;
    client_max_body_size 20m;

    # Holding each upstream in a variable is what forces nginx to re-resolve it per
    # request instead of pinning the address at config load. Using a variable also
    # stops nginx forwarding the request URI implicitly, so every proxy_pass below
    # appends $request_uri explicitly.
    set $identity    http://identity-service:8001;
    set $registration http://registration-service:8002;
    set $assessment  http://assessment-content-service:8003;
    set $result      http://result-service:8004;
    set $appeal      http://appeal-certificate-service:8005;
    set $notification http://notification-service:8006;
    set $reporting   http://reporting-service:8007;
    set $integration http://integration-service:8008;

    # Declared once at server level so every location inherits all three. nginx
    # replaces - never merges - inherited proxy_set_header directives, so a
    # location that declares its own would silently drop these; none below do.
    #
    # X-Internal-Service-Key is pinned to the empty string, which makes nginx omit
    # the header entirely rather than pass the client's. Services treat that header
    # as proof the caller is another service on the internal network
    # (assertInternalService in libs/common/src/internal-auth.ts), so a request
    # arriving from the public internet must never be able to supply it. nginx
    # forwards unknown client headers by default, so this has to be stated
    # explicitly - deleting a `proxy_set_header X-Internal-Service-Key $http_...`
    # line is not enough to stop the header getting through.
    proxy_set_header X-Request-Id $request_id;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Internal-Service-Key "";

    location = / {
      default_type application/json;
      add_header Cache-Control "no-store";
      add_header X-Request-Id $request_id;
      return 200 '{"name":"Dzongjuk DSTS API Gateway","status":"UP","apiBase":"/api/v1","health":"/health","documentation":{"identity":"/api/docs/identity/","registration":"/api/docs/registration/"}}';
    }

    # ─── internal-only endpoints: not routable from the public listener ───────
    # These four are guarded by the shared internal-service secret instead of a
    # user session, so they have no business being reachable by a public client at
    # all. Stripping the header above already makes them un-authenticable; these
    # blocks stop the request reaching the service in the first place. Regex
    # locations are matched in declaration order, so they must stay above the
    # broader service routes below.
    location ~ ^/api/v1/admin/users/[^/]+/internal-contact { return 404; }
    location ~ ^/api/v1/applications/internal/ { return 404; }
    location ~ ^/api/v1/appeals/[^/]+/payment/confirm { return 404; }
    location ~ ^/api/v1/internal/ { return 404; }

    location ~ ^/api/v1/(auth|admin) { limit_req zone=api burst=40 nodelay; proxy_pass $identity$request_uri; }
    location ~ ^/api/v1/exams/[^/]+/(committee|scores|declare-results) { limit_req zone=api burst=30 nodelay; proxy_pass $result$request_uri; }
    location ~ ^/api/v1/(exams|applications|verification|attendance) { limit_req zone=api burst=40 nodelay; proxy_pass $registration$request_uri; }
    location ~ ^/api/v1/(question-papers|sample-papers|questions) { limit_req zone=api burst=20 nodelay; proxy_pass $assessment$request_uri; }
    location ~ ^/api/v1/(score-sheets|results|scoring-rules) { limit_req zone=api burst=30 nodelay; proxy_pass $result$request_uri; }
    location ~ ^/api/v1/(appeals|appeal-fees|certificates|certificate-templates|public/certificates) { limit_req zone=api burst=30 nodelay; proxy_pass $appeal$request_uri; }
    location ~ ^/api/v1/(notifications|notification-preferences) { limit_req zone=api burst=40 nodelay; proxy_pass $notification$request_uri; }
    location ~ ^/api/v1/(dashboard|reports|audit) { limit_req zone=api burst=20 nodelay; proxy_pass $reporting$request_uri; }
    location ~ ^/api/v1/(integrations|payments) { limit_req zone=api burst=20 nodelay; proxy_pass $integration$request_uri; }

    # These three rewrite the path before proxying. With a variable upstream nginx
    # forwards the rewritten URI, so the rewrite has to produce the final path.
    location /api/docs/identity {
      rewrite ^/api/docs/identity/?(.*)$ /api/docs/$1 break;
      proxy_pass $identity;
    }
    location /api/docs/registration {
      rewrite ^/api/docs/registration/?(.*)$ /api/docs/$1 break;
      proxy_pass $registration;
    }
    location /health {
      rewrite ^ /health/ready break;
      proxy_pass $identity;
    }
  }

  # ─── internal gateway ──────────────────────────────────────────────────────
  # A separate listener that DOES forward X-Internal-Service-Key, carrying only the
  # internal-service-key guarded routes. Service-to-service traffic does not use it
  # (each client calls its peer's container address directly - see RESULT_SERVICE_URL
  # and REGISTRATION_SERVICE_URL); it exists so host-side tooling such as
  # scripts/local-acceptance.ts has one reachable internal path. compose.yml binds
  # it to 127.0.0.1 only, and the staging/production gateways do not define it.
  server {
    listen 8010;
    client_max_body_size 20m;

    set $identity_internal    http://identity-service:8001;
    set $registration_internal http://registration-service:8002;
    set $result_internal      http://result-service:8004;
    set $appeal_internal      http://appeal-certificate-service:8005;

    proxy_set_header X-Request-Id $request_id;
    proxy_set_header X-Internal-Service-Key $http_x_internal_service_key;

    location ~ ^/api/v1/admin/users/[^/]+/internal-contact { proxy_pass $identity_internal$request_uri; }
    location ~ ^/api/v1/applications/internal/ { proxy_pass $registration_internal$request_uri; }
    location ~ ^/api/v1/appeals/[^/]+/payment/confirm { proxy_pass $appeal_internal$request_uri; }
    location ~ ^/api/v1/internal/ { proxy_pass $result_internal$request_uri; }
    location / { return 404; }
  }
}
