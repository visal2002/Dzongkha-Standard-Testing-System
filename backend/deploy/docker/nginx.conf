events {}
http {
  limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

  # Docker's embedded DNS server.
  #
  # Without a resolver, nginx resolves every proxy_pass hostname once while loading
  # the configuration and then caches that IP for the lifetime of the worker. Each
  # `docker compose up --build` recreates the service containers and Docker hands
  # them new IPs, so the gateway carries on proxying to addresses nothing is
  # listening on any more and answers 502 until it is manually restarted. The
  # browser surfaces that as "Network Error", and it comes back on every rebuild.
  resolver 127.0.0.11 valid=10s ipv6=off;

  server {
    listen 8000;
    client_max_body_size 20m;

    # Holding each upstream in a variable is what forces nginx to re-resolve it per
    # request instead of pinning the address at config load. Using a variable also
    # stops nginx forwarding the request URI implicitly, so every proxy_pass below
    # appends $request_uri explicitly.
    set $identity    http://identity-service:8001;
    set $registration http://registration-service:8002;
    set $assessment  http://assessment-content-service:8003;
    set $result      http://result-service:8004;
    set $appeal      http://appeal-certificate-service:8005;
    set $notification http://notification-service:8006;
    set $reporting   http://reporting-service:8007;
    set $integration http://integration-service:8008;

    location = / {
      default_type application/json;
      add_header Cache-Control "no-store";
      add_header X-Request-Id $request_id;
      return 200 '{"name":"Dzongjuk DSTS API Gateway","status":"UP","apiBase":"/api/v1","health":"/health","documentation":{"identity":"/api/docs/identity/","registration":"/api/docs/registration/"}}';
    }
    location ~ ^/api/v1/(auth|admin) { limit_req zone=api burst=40 nodelay; proxy_pass $identity$request_uri; proxy_set_header X-Request-Id $request_id; proxy_set_header Authorization $http_authorization; }
    location ~ ^/api/v1/exams/[^/]+/(committee|scores|declare-results) { limit_req zone=api burst=30 nodelay; proxy_pass $result$request_uri; proxy_set_header X-Request-Id $request_id; proxy_set_header Authorization $http_authorization; }
    location ~ ^/api/v1/(exams|applications|verification|attendance) { limit_req zone=api burst=40 nodelay; proxy_pass $registration$request_uri; proxy_set_header X-Request-Id $request_id; proxy_set_header Authorization $http_authorization; }
    location ~ ^/api/v1/(question-papers|sample-papers|questions) { limit_req zone=api burst=20 nodelay; proxy_pass $assessment$request_uri; proxy_set_header X-Request-Id $request_id; proxy_set_header Authorization $http_authorization; }
    location ~ ^/api/v1/(score-sheets|results|scoring-rules) { limit_req zone=api burst=30 nodelay; proxy_pass $result$request_uri; proxy_set_header X-Request-Id $request_id; proxy_set_header Authorization $http_authorization; }
    location ~ ^/api/v1/(appeals|appeal-fees|certificates|certificate-templates|public/certificates) { limit_req zone=api burst=30 nodelay; proxy_pass $appeal$request_uri; proxy_set_header X-Request-Id $request_id; proxy_set_header Authorization $http_authorization; proxy_set_header X-Internal-Service-Key $http_x_internal_service_key; }
    location ~ ^/api/v1/(notifications|notification-preferences) { limit_req zone=api burst=40 nodelay; proxy_pass $notification$request_uri; proxy_set_header X-Request-Id $request_id; proxy_set_header Authorization $http_authorization; }
    location ~ ^/api/v1/(dashboard|reports|audit) { limit_req zone=api burst=20 nodelay; proxy_pass $reporting$request_uri; proxy_set_header X-Request-Id $request_id; proxy_set_header Authorization $http_authorization; }
    location ~ ^/api/v1/(integrations|payments) { limit_req zone=api burst=20 nodelay; proxy_pass $integration$request_uri; proxy_set_header X-Request-Id $request_id; proxy_set_header Authorization $http_authorization; }

    # These three rewrite the path before proxying. With a variable upstream nginx
    # forwards the rewritten URI, so the rewrite has to produce the final path.
    location /api/docs/identity {
      rewrite ^/api/docs/identity/?(.*)$ /api/docs/$1 break;
      proxy_pass $identity;
    }
    location /api/docs/registration {
      rewrite ^/api/docs/registration/?(.*)$ /api/docs/$1 break;
      proxy_pass $registration;
    }
    location /health {
      rewrite ^ /health/ready break;
      proxy_pass $identity;
    }
  }
}
