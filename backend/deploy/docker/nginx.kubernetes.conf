pid /tmp/nginx/nginx.pid;
error_log /dev/stderr warn;

events {}

http {
  access_log /dev/stdout;
  client_body_temp_path /tmp/nginx/client-body;
  proxy_temp_path /tmp/nginx/proxy;
  fastcgi_temp_path /tmp/nginx/fastcgi;
  uwsgi_temp_path /tmp/nginx/uwsgi;
  scgi_temp_path /tmp/nginx/scgi;
  limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

  server {
    listen 8000;
    client_max_body_size 50m;

    location = / {
      default_type application/json;
      add_header Cache-Control "no-store";
      add_header X-Request-Id $request_id;
      return 200 '{"name":"Dzongjuk DSTS API Gateway","status":"UP","apiBase":"/api/v1","health":"/health"}';
    }

    location ~ ^/api/v1/(auth|admin) { limit_req zone=api burst=40 nodelay; proxy_pass http://identity-service:8001; proxy_set_header X-Request-Id $request_id; proxy_set_header Authorization $http_authorization; }
    location ~ ^/api/v1/exams/[^/]+/(committee|scores|declare-results) { limit_req zone=api burst=30 nodelay; proxy_pass http://result-service:8004; proxy_set_header X-Request-Id $request_id; proxy_set_header Authorization $http_authorization; }
    location ~ ^/api/v1/(exams|applications|verification|attendance) { limit_req zone=api burst=40 nodelay; proxy_pass http://registration-service:8002; proxy_set_header X-Request-Id $request_id; proxy_set_header Authorization $http_authorization; }
    location ~ ^/api/v1/(question-papers|sample-papers|questions) { limit_req zone=api burst=20 nodelay; proxy_pass http://assessment-content-service:8003; proxy_set_header X-Request-Id $request_id; proxy_set_header Authorization $http_authorization; }
    location ~ ^/api/v1/(score-sheets|results|scoring-rules) { limit_req zone=api burst=30 nodelay; proxy_pass http://result-service:8004; proxy_set_header X-Request-Id $request_id; proxy_set_header Authorization $http_authorization; }
    location ~ ^/api/v1/(appeals|appeal-fees|certificates|certificate-templates|public/certificates) { limit_req zone=api burst=30 nodelay; proxy_pass http://appeal-certificate-service:8005; proxy_set_header X-Request-Id $request_id; proxy_set_header Authorization $http_authorization; proxy_set_header X-Internal-Service-Key $http_x_internal_service_key; }
    location ~ ^/api/v1/(notifications|notification-preferences) { limit_req zone=api burst=40 nodelay; proxy_pass http://notification-service:8006; proxy_set_header X-Request-Id $request_id; proxy_set_header Authorization $http_authorization; }
    location ~ ^/api/v1/(dashboard|reports|audit) { limit_req zone=api burst=20 nodelay; proxy_pass http://reporting-service:8007; proxy_set_header X-Request-Id $request_id; proxy_set_header Authorization $http_authorization; }
    location ~ ^/api/v1/(integrations|payments) { limit_req zone=api burst=20 nodelay; proxy_pass http://integration-service:8008; proxy_set_header X-Request-Id $request_id; proxy_set_header Authorization $http_authorization; }

    location /api/docs/identity { proxy_pass http://identity-service:8001/api/docs; }
    location /api/docs/registration { proxy_pass http://registration-service:8002/api/docs; }
    location /health { proxy_pass http://identity-service:8001/health/ready; }
  }
}
