stages:
  - validate
  - test
  - security
  - build
  - integration
  - deploy_staging
  - dast
  - deploy_prod

default:
  image: node:22.19.0-alpine
  cache:
    key:
      files: [package-lock.json]
    paths: [.npm/]
  before_script:
    - npm ci --cache .npm --prefer-offline

validate:
  stage: validate
  script:
    - npm run lint
    - npm run build:all

unit-test:
  stage: test
  script:
    - npm run test:cov
  artifacts:
    when: always
    paths: [coverage/]

dependency-audit:
  stage: security
  script:
    - npm audit --audit-level=high

secret-detection:
  stage: security
  before_script: []
  image: zricethezav/gitleaks:v8.28.0
  script:
    - gitleaks detect --source . --no-banner --redact

container-build:
  stage: build
  image: docker:28.3.3
  services: [docker:28.3.3-dind]
  parallel:
    matrix:
      - SERVICE: [identity-service, registration-service, assessment-content-service, result-service, appeal-certificate-service, notification-service, reporting-service, integration-service]
  script:
    - docker build --build-arg SERVICE=$SERVICE -t "$CI_REGISTRY_IMAGE/$SERVICE:$CI_COMMIT_SHA" .
    - docker push "$CI_REGISTRY_IMAGE/$SERVICE:$CI_COMMIT_SHA"

integration:
  stage: integration
  services:
    - name: postgres:17.6-alpine
      alias: postgres
  variables:
    POSTGRES_USER: dzongjuk
    POSTGRES_PASSWORD: integration-only
    POSTGRES_DB: dzongjuk
    DATABASE_HOST: postgres
  script:
    - npm run test:e2e

deploy-staging:
  stage: deploy_staging
  image: bitnami/kubectl:1.33.3
  before_script: []
  script:
    - kubectl apply -k deploy/k8s/overlays/staging
    - kubectl rollout status deployment/identity-service -n dzongjuk-staging --timeout=180s
    - kubectl rollout status deployment/registration-service -n dzongjuk-staging --timeout=180s
    - kubectl rollout status deployment/assessment-content-service -n dzongjuk-staging --timeout=180s
    - kubectl rollout status deployment/result-service -n dzongjuk-staging --timeout=180s
  environment: { name: staging }
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

dast:
  stage: dast
  image: ghcr.io/zaproxy/zaproxy:stable
  before_script: []
  script:
    - zap-baseline.py -t "$STAGING_BASE_URL" -r zap-report.html
  artifacts: { when: always, paths: [zap-report.html] }
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

deploy-production:
  stage: deploy_prod
  image: bitnami/kubectl:1.33.3
  before_script: []
  script:
    - kubectl apply -k deploy/k8s/overlays/production
    - kubectl rollout status deployment/identity-service -n dzongjuk-production --timeout=300s
    - kubectl rollout status deployment/assessment-content-service -n dzongjuk-production --timeout=300s
    - kubectl rollout status deployment/result-service -n dzongjuk-production --timeout=300s
  environment: { name: production }
  when: manual
  rules:
    - if: '$CI_COMMIT_TAG'
