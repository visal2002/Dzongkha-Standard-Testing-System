name: Dzongjuk quality checks

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend contracts and routes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dzongjuk-frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dzongjuk-frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run service contract tests
        run: npm test
      - name: Check production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run role route tests
        run: npm run test:e2e:ci
      - name: Upload browser test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: dzongjuk-frontend/playwright-report/
          retention-days: 14

  backend:
    name: Backend build, lint, and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build all services
        run: npm run build:all
      - name: Run lint
        run: npm run lint
      - name: Run tests
        run: npm test
      - name: Check production dependencies
        run: npm audit --omit=dev --audit-level=high

  deployment-package:
    name: Kubernetes deployment package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.34.1
      - name: Render GovTech manifests
        run: |
          kubectl kustomize backend/deploy/k8s/govtech/platform > /tmp/platform.yaml
          kubectl kustomize backend/deploy/k8s/govtech/apps > /tmp/apps.yaml
          cat /tmp/platform.yaml /tmp/apps.yaml > /tmp/dzongjuk.yaml
      - name: Verify deployment inventory
        run: |
          test "$(grep -c '^kind: Deployment$' /tmp/dzongjuk.yaml)" -eq 14
          test "$(grep -c '^kind: Service$' /tmp/dzongjuk.yaml)" -eq 14
          test "$(grep -c '^kind: PersistentVolumeClaim$' /tmp/dzongjuk.yaml)" -eq 4
          test "$(grep -c '^kind: Ingress$' /tmp/dzongjuk.yaml)" -eq 1
      - name: Parse deployment script
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'backend/scripts/deploy-govtech.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
