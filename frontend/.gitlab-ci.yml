stages:
  - validate
  - test
  - build

default:
  image: node:22.19.0-alpine
  cache:
    key:
      files: [package-lock.json]
    paths: [.npm/]
  before_script:
    - npm ci --cache .npm --prefer-offline

# ── Validate: lint + type-check the production build ─────────────────────────
validate:
  stage: validate
  script:
    - npm run build
  artifacts:
    when: on_success
    paths: [dist/]
    expire_in: 1 hour

# ── Unit tests ─────────────────────────────────────────────────────────────────
unit-test:
  stage: test
  script:
    - npm run test
  coverage: '/^All files.*?\s+([\d.]+)/'

# ── Docker image build & push (UAT and main only) ─────────────────────────────
container-build:
  stage: build
  image: docker:28.3.3
  services:
    - name: docker:28.3.3-dind
      alias: docker
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - docker build -t "$CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHA" .
    - docker push "$CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHA"
    - docker tag "$CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHA" "$CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_REF_SLUG"
    - docker push "$CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_REF_SLUG"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "UAT"'
