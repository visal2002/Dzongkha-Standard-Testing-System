server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # nginx replaces inherited add_header directives rather than merging them, so a
  # location that declares any add_header of its own loses every header set at
  # server level. The static-asset location below sets Cache-Control, so the
  # security headers have to be repeated there - see the comment on that block.
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options SAMEORIGIN always;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Repeats the three headers above because declaring Cache-Control here would
  # otherwise drop them for every .js/.css/image response.
  location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
    expires 1h;
    add_header Cache-Control "public, max-age=3600";
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    try_files $uri =404;
  }
}
