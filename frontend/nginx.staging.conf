pid /tmp/nginx.pid;

events {}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  error_log /dev/stderr warn;
  sendfile on;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Browser features this SPA never uses. Denying them limits what injected
    # third-party code could reach for.
    add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), usb=(), interest-cohort=()" always;

    # Content-Security-Policy, deliberately in Report-Only for this staging rollout.
    # Violations appear in the browser console (and at any report endpoint added
    # later) without blocking anything, so the policy can be confirmed against a
    # real NDI login, a BIRMS payment redirect and a certificate/report download
    # before it is enforced. Promote it by renaming the header to
    # Content-Security-Policy once staging reports a clean run.
    #
    # Each source below was derived from the built bundle, not assumed:
    #   script-src 'self'      - dist/index.html carries no inline <script>; every
    #                            module is a hashed file under /assets. No
    #                            'unsafe-inline' and no 'unsafe-eval' are needed.
    #   style-src 'unsafe-inline'
    #                          - REQUIRED. The main bundle and framer-motion both
    #                            call document.createElement("style") at runtime to
    #                            inject rules, which style-src-elem blocks outright.
    #                            There is no nonce to attach to a stylesheet a
    #                            library creates after load. Scripts stay strict, so
    #                            this does not open script injection.
    #   fonts.googleapis.com / fonts.gstatic.com
    #                          - src/index.css @imports the Inter face from Google
    #                            Fonts and the built CSS keeps that @import.
    #   img-src data: blob:    - user photos arrive as data: URIs and report/
    #                            certificate downloads build blob: object URLs.
    #   connect-src 'self'     - the image is built with VITE_API_BASE_URL=/api/v1
    #                            (see Dockerfile), so the SPA calls this same origin
    #                            and the /api/ block below proxies to the gateway.
    #                            A deployment that points the SPA at a cross-origin
    #                            API must add that origin here before enforcing.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'" always;

    # Strict-Transport-Security is intentionally NOT set here. This container
    # terminates plain HTTP on :8080 behind a NodePort and the backend ships
    # COOKIE_SECURE=false, so staging has no TLS to pin. Add
    #   add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # at the TLS-terminating ingress once HTTPS is in front of this service -
    # setting it here would only take effect after a request that is already
    # HTTPS, and pinning a host that still serves HTTP locks users out.

    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    location /api/ {
      proxy_pass http://api-gateway:8000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Authorization $http_authorization;
      # Pinned empty so nginx drops the header instead of forwarding the client's.
      # Backend services read X-Internal-Service-Key as proof the caller is another
      # service on the internal network, so a browser must never be able to set it.
      # The api-gateway strips it again; both layers do so independently on purpose.
      proxy_set_header X-Internal-Service-Key "";
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
