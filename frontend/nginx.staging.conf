pid /tmp/nginx.pid;

events {}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  error_log /dev/stderr warn;
  sendfile on;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  server {
    listen 8080;
    server_name _;
    client_max_body_size 52m;
    root /usr/share/nginx/html;
    index index.html;

    # The application is built against the same-origin /api/v1 route. Keep the
    # policy centralized and include it again in locations that set Cache-Control,
    # because nginx replaces (rather than merges) inherited add_header directives.
    include /etc/nginx/security-headers.conf;

    # Strict-Transport-Security is intentionally NOT set here. This container
    # terminates plain HTTP on :8080 behind a NodePort and the backend ships
    # COOKIE_SECURE=false, so staging has no TLS to pin. Add
    #   add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # at the TLS-terminating ingress once HTTPS is in front of this service -
    # setting it here would only take effect after a request that is already
    # HTTPS, and pinning a host that still serves HTTP locks users out.

    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    # Scanner and platform health probes must not fall through to the SPA shell.
    location = /health/live {
      access_log off;
      default_type application/json;
      return 200 '{"status":"ok"}';
    }

    location = /health/ready {
      access_log off;
      default_type application/json;
      return 200 '{"status":"ok"}';
    }

    # Metrics are intentionally not exposed by the public frontend edge.
    location = /metrics {
      access_log off;
      default_type application/json;
      return 404 '{"statusCode":404,"message":"Not Found"}';
    }

    location = /api {
      default_type application/json;
      return 404 '{"statusCode":404,"message":"Not Found"}';
    }

    location /api/ {
      proxy_pass http://api-gateway:8000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Authorization $http_authorization;
      # Pinned empty so nginx drops the header instead of forwarding the client's.
      # Backend services read X-Internal-Service-Key as proof the caller is another
      # service on the internal network, so a browser must never be able to set it.
      # The api-gateway strips it again; both layers do so independently on purpose.
      proxy_set_header X-Internal-Service-Key "";
    }

    location /assets/ {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      try_files $uri =404;
    }

    location / {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "no-store, no-cache, must-revalidate" always;
      try_files $uri $uri/ /index.html;
    }
  }
}
