pid /tmp/nginx.pid;
events {}
http {
  proxy_temp_path /tmp/proxy_temp;
  client_body_temp_path /tmp/client_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

  server {
    listen 8000;
    client_max_body_size 20m;

    # Declared once at server level so every location inherits all three. nginx
    # replaces - never merges - inherited proxy_set_header directives, so a
    # location that declares its own would silently drop these; none below do.
    #
    # X-Internal-Service-Key is pinned to the empty string, which makes nginx omit
    # the header entirely rather than pass the client's. Services treat that header
    # as proof the caller is another service on the cluster network
    # (assertInternalService in libs/common/src/internal-auth.ts), so a request
    # arriving through the public ingress must never be able to supply it. nginx
    # forwards unknown client headers by default, so this has to be stated
    # explicitly - deleting a `proxy_set_header X-Internal-Service-Key $http_...`
    # line is not enough to stop the header getting through.
    proxy_set_header X-Request-Id $request_id;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Internal-Service-Key "";

    location = / {
      default_type application/json;
      add_header Cache-Control "no-store";
      add_header X-Request-Id $request_id;
      return 200 '{"name":"Dzongjuk DSTS API Gateway","status":"UP","apiBase":"/api/v1","health":"/health"}';
    }

    # ─── internal-only endpoints: never routable from outside the cluster ─────
    # Guarded by the shared internal-service secret rather than a user session.
    # Callers are other services, which reach each other on the cluster network
    # (RESULT_SERVICE_URL / REGISTRATION_SERVICE_URL) and never through this
    # gateway. Regex locations match in declaration order, so these must stay
    # above the broader service routes below.
    location ~ ^/api/v1/admin/users/[^/]+/internal-contact { return 404; }
    location ~ ^/api/v1/applications/internal/ { return 404; }
    location ~ ^/api/v1/appeals/[^/]+/payment/confirm { return 404; }
    location ~ ^/api/v1/internal/ { return 404; }

    location ~ ^/api/v1/(auth|admin) { limit_req zone=api burst=40 nodelay; proxy_pass http://identity-service:8001; }
    location ~ ^/api/v1/exams/[^/]+/(committee|scores|candidates|declare-results) { limit_req zone=api burst=30 nodelay; proxy_pass http://result-service:8004; }
    location ~ ^/api/v1/(exams|applications|verification|attendance) { limit_req zone=api burst=40 nodelay; proxy_pass http://registration-service:8002; }
    location ~ ^/api/v1/payments/birms/(callback|reversal) { limit_req zone=api burst=20 nodelay; proxy_pass http://registration-service:8002; }
    location ~ ^/api/v1/(question-papers|sample-papers|questions) { limit_req zone=api burst=20 nodelay; proxy_pass http://assessment-content-service:8003; }
    location ~ ^/api/v1/(score-sheets|results|scoring-rules) { limit_req zone=api burst=30 nodelay; proxy_pass http://result-service:8004; }
    location ~ ^/api/v1/(appeals|appeal-fees|certificates|certificate-templates|public/certificates) { limit_req zone=api burst=30 nodelay; proxy_pass http://appeal-certificate-service:8005; }
    location ~ ^/api/v1/(notifications|notification-preferences) { limit_req zone=api burst=40 nodelay; proxy_pass http://notification-service:8006; }
    location ~ ^/api/v1/(dashboard|reports|audit) { limit_req zone=api burst=20 nodelay; proxy_pass http://reporting-service:8007; }
    location ~ ^/api/v1/(integrations|payments) { limit_req zone=api burst=20 nodelay; proxy_pass http://integration-service:8008; }
    location /api/docs/identity { proxy_pass http://identity-service:8001/api/docs; }
    location /api/docs/registration { proxy_pass http://registration-service:8002/api/docs; }
    location /health { proxy_pass http://identity-service:8001/health/ready; }
  }
}
