apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dzongjuk
resources:
  - infrastructure.yaml
  - backend.yaml
  - frontend.yaml
configMapGenerator:
  - name: database-migrations
    files:
      - provision-service-databases.sh=../../../backend/database/provision-service-databases.sh
      - 0001_initial.sql=../../../backend/database/migrations/0001_initial.sql
      - 0002_assessment_results.sql=../../../backend/database/migrations/0002_assessment_results.sql
      - 0003_appeals.sql=../../../backend/database/migrations/0003_appeals.sql
      - 0004_certificates_notifications.sql=../../../backend/database/migrations/0004_certificates_notifications.sql
      - 0005_appeal_score_revisions.sql=../../../backend/database/migrations/0005_appeal_score_revisions.sql
      - 0006_reporting.sql=../../../backend/database/migrations/0006_reporting.sql
      - 0007_ndi_login.sql=../../../backend/database/migrations/0007_ndi_login.sql
      - 0008_access_matrix.sql=../../../backend/database/migrations/0008_access_matrix.sql
  - name: api-gateway-config
    files:
      - nginx.conf=api-gateway.conf
